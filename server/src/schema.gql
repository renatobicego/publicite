  """URLs de imágenes ya subidas (sólo hosts de Publicité)"""
  imageUrls: [String!]

  """Descripción libre inicial de lo que se quiere valuar"""
  description: String

  """Modo de Cubito (general, marketing, analista_mercado, ...)"""
  mode: String

  """sessionId del chat del workspace, para correlacionar la conversación"""
  sessionId: String
}

"""Categoría de lo que se valúa (imagen, objeto, servicio, bien, otro)"""
enum ValuacionCategory {
  imagen
  objeto
  servicio
  bien
  otro
}

input ValuacionMessageRequest {
  valuacionId: String!
  message: String!

  """Imágenes adicionales que se suman a la valuación"""
  imageUrls: [String!]
}

input SearchMatchRequest {
  """Texto libre: una necesidad, un producto, un servicio"""
  text: String

  """URLs de imágenes ya subidas (sólo hosts de Publicité)"""
  imageUrls: [String!]

  """Id de un anuncio existente para buscar similares"""
  postId: String

  """Modo de Cubito aplicado a la búsqueda"""
  mode: String

  """sessionId del workspace, para el tracking de tokens"""
  sessionId: String
}