  Sólo admin: todos los tickets de todos los usuarios, paginados y filtrables
  """
  getAllInvoicesAdmin(page: Int!, limit: Int!, filters: AdminInvoiceFiltersInput): AdminInvoiceGetAllResponse!

  """Obtiene los posts totales del usuario y los limites segun su plan"""
  getPostAndContactLimit: PostLimitResponseGraphql

  """Obtener todos los posts del autor por id"""
